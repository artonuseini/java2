<body>
  <input type="number" id="nr" placeholder="Sheno nr">
  <button type="submit" onclick="tekcift()">Kontrollo</button>
  <p id='result'></p>

  <script>
    function tekcift()
    {
      var numri=document.getElementById('nr').value;
     if (numri == 0)
   {
      document.getElementById('result').innerHTML = 'Numri 0 nuk eshte as Cift as Tek';
   }
   else if (numri % 2 == 0)
     {
       document.getElementById('result').innerHTML = 'Numer Cift';
     }
   else
     {
       document.getElementById('result').innerHTML = 'Numer Tek';
      }
    }
  </script>

  <h1 id="ngjyra">Ndrysho prapavije</h1>
  <button type="submit" onclick="prapavija()">Ndrysho ngjyren</button>

  <script>
    function prapavija()
    {
      const colors=['red','blue','green'];
      const colors1=['pink','purple','black'];
      
      const index=Math.floor(Math.random()*colors.length)
      const index1=Math.floor(Math.random()*colors1.length)
